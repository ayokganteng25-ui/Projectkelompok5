<!-- Bagian Risky: kado penyemangat dengan nama penerima. -->
<template id="project-risky"><div class="container">

        <h1>🎁 Kado Untukmu</h1>

        <p class="subtitle">
            Ada sebuah pesan kecil yang ingin
            disampaikan kepadamu ❤️
        </p>


        

        <input
            type="text"
            id="nama" aria-label="Nama kamu" maxlength="80"
            placeholder="Masukkan nama kamu..."
        >


        <p id="nama-error" role="alert" hidden>Masukkan nama terlebih dahulu ❤️</p>
        <p class="click-text">
            Klik kado di bawah untuk membukanya 🎁
        </p>


        

        <div
            class="gift-container" role="button" tabindex="0" aria-label="Buka kado"
            onclick="bukaKado()">

             <div class="gift" id="gift">

                

                <div class="gift-lid">

                    <div class="ribbon-left"></div>

                    <div class="ribbon-right"></div>

                </div>
                

                

                <div class="gift-body"></div>


                

                <div class="ribbon-vertical"></div>

            </div>

        </div>


        

        <div
            class="message"
            id="message"
        >

            <h2 id="judul">
                Untukmu ❤️
            </h2>

            <p>

                Aku tahu mungkin akhir-akhir ini
                semuanya terasa berat.

                <br><br>

                Tapi jangan menyerah, ya. 🌷

                Kamu sudah melewati banyak hal
                sampai sejauh ini, dan itu berarti
                kamu jauh lebih kuat dari yang kamu kira.

                <br><br>

                Tidak apa-apa kalau hari ini kamu
                berjalan pelan. Tidak apa-apa
                kalau kamu ingin beristirahat.

                <br><br>

                Yang penting, jangan berhenti
                percaya bahwa akan ada hari
                yang lebih baik.

                <br><br>

                ✨ Setiap langkah kecil yang kamu
                lakukan tetap berarti.

                <br><br>

                Kamu hebat.
                Kamu berharga.
                Kamu mampu melewati ini.

                <br><br>

                Tetap semangat dan jangan
                menyerah pada dirimu sendiri. ❤️

            </p>

        </div>


        

        <button
            class="reset"
            id="reset"
            onclick="resetKado()"
        >
            🎁 Buka Lagi
        </button>

    </div></template>
